# E2 staging preparation only; manual deployment requires separate approval.
services:
  - type: web
    name: event-radar-api-staging
    runtime: python
    plan: free
    branch: e2/first-user-vertical-slice
    autoDeployTrigger: "off"
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn event_radar.api.app:create_app --factory --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: UV_VERSION
        value: 0.11.28
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: PACKET_RESEARCH_POLICY
        value: e1-weekly-sonoma-v1
