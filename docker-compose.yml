name: event-radar-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: event_radar
      POSTGRES_USER: event_radar
      POSTGRES_PASSWORD: event_radar_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_radar -d event_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
