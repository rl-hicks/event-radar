name: Event Radar CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/e0-productization-foundation

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_radar_ci
          POSTGRES_USER: event_radar
          POSTGRES_PASSWORD: event_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_radar -d event_radar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://event_radar:event_radar@localhost:5432/event_radar_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Apply migrations to PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify API database health
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from event_radar.api.app import app

          response = TestClient(app).get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok", "database": "ok"}
          PY
      - name: Whitespace check
        run: git diff --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
