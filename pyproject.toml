[project]
name = "event-radar"
version = "0.1.0"
description = "Personalized local event aggregation and Telegram digest service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "openai>=2.53.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
event-radar = "event_radar.main:main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["event_radar"]
mypy_path = "src"
